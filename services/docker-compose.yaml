name: services

services:
  web-gateway:
    profiles:
      - tailscale
    image: tailscale/tailscale:stable
    container_name: web-gateway
    hostname: web-gateway
    environment:
      # Compose interpolates profile services before filtering them; keep this optional so the core does not require it.
      TS_AUTHKEY: ${WEB_GATEWAY_TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: web-gateway
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /etc/tailscale/serve.json
    configs:
      - source: web-gateway-serve
        target: /etc/tailscale/serve.json
    volumes:
      - web-gateway-tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: [ "CMD", "tailscale", "status", "--peers=false" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - shared

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      # Development only: host connections and containers connected to external `shared` are trusted.
      # Do not use this authentication policy on untrusted networks or in production.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - shared

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Define PGADMIN_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Define PGADMIN_PASSWORD en .env}
      SCRIPT_NAME: /pgadmin
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: "5050"
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - shared

volumes:
  web-gateway-tailscale:
    name: web-gateway-tailscale
  postgres-data:
    name: postgres-data
  pgadmin-data:
    name: pgadmin-data

configs:
  web-gateway-serve:
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/pgadmin": {
                "Proxy": "http://pgadmin:5050/pgadmin"
              }
            }
          }
        },
        "AllowFunnel": {
          "$${TS_CERT_DOMAIN}:443": false
        }
      }

networks:
  shared:
    external: true
    name: shared
